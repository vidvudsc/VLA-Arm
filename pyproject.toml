[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-arm"
version = "0.1.0"
description = "VLA-Arm: tiny local vision-language-action experiment with a mobile base and 2D arm."
requires-python = ">=3.11"
dependencies = [
  "torch",
  "numpy",
  "pillow",
  "tqdm",
  "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]
